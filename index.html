<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALIMOVAURA — Institutsional va Smart Money terminali</title>
<style>
:root{
  --bg:#FFFFFF; --card:#FAFAFA; --line:#E7E5E4; --gb:#EBD99A; --ink:#0F172A; --mut:#334155;
  --gold:#D4AF37; --gold2:#C59B27; --goldsoft:#FBF5DD; --goldtint:#FFFBEB;
  --buy:#059669; --buyink:#047857; --sell:#DC2626; --sellink:#BE123C;
}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:#E5D399 transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#E5D399;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:var(--gold)}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.45}
button,select,input{font:inherit;color:inherit}
a{color:var(--ink);text-decoration:none;font-weight:600}
.up{color:var(--buyink)} .down{color:var(--sellink)}
.coin{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:9px;font-weight:800;color:#fff;flex:none;letter-spacing:-.3px}

/* ticker: uniform pill cards */
.ticker{display:flex;gap:10px;overflow-x:auto;padding:10px 22px;background:#fff;border-bottom:1px solid var(--line);scrollbar-width:none}
.ticker::-webkit-scrollbar{display:none}
.tk{display:flex;align-items:center;justify-content:center;gap:9px;padding:7px 14px;min-width:176px;flex:1 0 auto;white-space:nowrap;border:1px solid var(--line);border-radius:999px;background:var(--card);transition:.15s}
.tk:hover{border-color:var(--gold);background:var(--goldtint);box-shadow:0 2px 10px rgba(212,175,55,.2)}
.tk .sym{font-weight:800}
.tk .px{font-variant-numeric:tabular-nums;font-weight:600}
.badge{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;font-variant-numeric:tabular-nums}
.badge.up{background:#D1FAE5;color:#065F46} .badge.down{background:#FFE4E6;color:#9F1239}

/* header */
.top{display:flex;align-items:center;gap:14px;padding:12px 22px;border-bottom:2px solid transparent;border-image:linear-gradient(90deg,var(--gold),#F1D98A,var(--gold2)) 1;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.brand svg{width:34px;height:34px}
.brand .name{font-size:22px;font-weight:800;letter-spacing:2.4px;background:linear-gradient(90deg,#B8941F,#D4AF37 45%,#C59B27);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .tag{font-size:12px;color:var(--mut);letter-spacing:.3px;margin-top:-2px}
.sync{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--buy);display:inline-block}
.dot.busy{background:var(--gold);animation:pulse 1s infinite}
.dot.err{background:var(--sell)}
.sync b{color:var(--ink)}
@keyframes pulse{50%{opacity:.25}}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600;transition:.15s;color:var(--ink)}
.btn:hover{border-color:var(--gold);background:var(--goldtint)}
.btn.gold{background:linear-gradient(180deg,#E3C14F,#D4AF37);border-color:var(--gold2);color:var(--ink);font-weight:700}
.btn.gold:hover{filter:brightness(1.04);background:linear-gradient(180deg,#E8C85A,#D4AF37)}
.btn:disabled{opacity:.5;cursor:default}
.lang{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.lang button{border:0;background:#fff;padding:8px 12px;cursor:pointer;font-weight:700;color:var(--mut)}
.lang button.on{background:var(--goldsoft);color:var(--ink);box-shadow:inset 0 -2px 0 var(--gold)}

/* AI analyst: compact + collapsible */
.aiwrap{padding:12px 22px 0}
.ai{background:#fff;border:1px solid var(--gold);border-radius:12px;padding:8px 14px;box-shadow:0 0 0 3px var(--goldsoft)}
.aih{display:flex;align-items:center;gap:8px}
.aih b{font-size:12px;letter-spacing:1.1px;color:var(--ink)}
.aih b::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--gold);margin-right:8px;transform:rotate(45deg)}
.aih .info{color:var(--mut);cursor:help;font-size:13px}
.aih .sp{flex:1}
.btn.sm{padding:4px 10px;font-size:12.5px;display:flex;align-items:center;gap:6px}
.btn.sm svg{width:14px;height:14px}
.btn.sm.on{background:var(--goldsoft);border-color:var(--gold)}
.btn.ico svg{transition:transform .2s}
.ai.closed .btn.ico svg{transform:rotate(180deg)}
.aib{margin-top:6px}
.ai.closed .aib{display:none}
.ais{display:none;margin-top:4px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai.closed .ais{display:block}
.ai ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.ai li{padding-left:10px;border-left:3px solid var(--line);font-size:13px;line-height:1.35}
.ai li.bull{border-color:var(--buy)} .ai li.bear{border-color:var(--sell)} .ai li.flat{border-color:var(--gold)}
.ai li .bar{height:3px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden;max-width:220px}
.ai li .bar i{display:block;height:100%}
.ai li.bull .bar i{background:var(--buy)} .ai li.bear .bar i{background:var(--sell)} .ai li.flat .bar i{background:var(--gold)}
.ai .none{color:var(--mut);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;align-items:center}
.chips .lbl{font-size:11.5px;font-weight:700;color:var(--mut);margin-right:2px}
.cb{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 10px 2px 3px;border-radius:999px;border:1px solid;font-variant-numeric:tabular-nums;font-weight:700}
.cb .coin{width:18px;height:18px;font-size:8px}
.cb.up{background:#ECFDF5;border-color:#A7F3D0;color:#065F46} .cb.down{background:#FFF1F2;border-color:#FECDD3;color:#9F1239}

/* layout: both panels share row tracks -> headers, filters and table heads line up */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:18px;padding:14px 22px 10px;align-items:stretch}
.panel{display:grid;grid-row:span 5;grid-template-rows:subgrid;background:var(--card);border:1px solid var(--gb);border-radius:14px;overflow:hidden;min-width:0}
@media(max-width:1180px){.grid{grid-template-columns:1fr;row-gap:16px}.panel{grid-row:auto;grid-template-rows:none;display:flex;flex-direction:column}}
@supports not (grid-template-rows:subgrid){.panel{display:flex;flex-direction:column}}
.ph{display:flex;align-items:flex-start;gap:12px;padding:14px 18px 8px;flex-wrap:wrap}
.ph h2{margin:0;font-size:16px;letter-spacing:1.4px;font-weight:800}
.ph p{margin:2px 0 0;color:var(--mut);font-size:12.5px}
.sel{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 8px;cursor:pointer}
.sel:hover,.sel:focus{border-color:var(--gold);outline:none}
.ins{padding-bottom:2px;min-width:0}

/* pills / flow / bars */
.pills{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px 10px;align-items:center}
.pills .lb{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin-right:2px}
.pl{border:1px solid var(--gb);background:#fff;border-radius:999px;padding:3px 12px;cursor:pointer;font-size:12.5px;font-weight:600}
.pl:hover{border-color:var(--gold);background:var(--goldtint)}
.pl.on{background:linear-gradient(180deg,#E3C14F,#D4AF37);color:var(--ink);border-color:var(--gold2);font-weight:700}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 18px 10px}
.flow div{background:#fff;border:1px solid var(--gb);border-radius:10px;padding:7px 12px;min-width:0}
.flow small{display:block;color:var(--mut);font-size:11.5px;font-weight:600}
.flow b{font-size:16px;font-variant-numeric:tabular-nums}
.balwrap{margin:0 18px 10px}
.bal{display:flex;height:10px;border-radius:10px;overflow:hidden;background:var(--line)}
.bal i{display:block;height:100%;transition:width .4s}
.bal .g{background:var(--buy)} .bal .r{background:var(--sell)}
.bl{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-top:4px}
.clu{display:flex;flex-direction:column;gap:6px;margin:0 18px 10px}
.clb{border-radius:10px;padding:7px 12px;font-weight:800;letter-spacing:.4px;border:1px solid}
.clb small{display:block;font-weight:500;letter-spacing:0;color:var(--mut)}
.clb.buy{background:#ECFDF5;border-color:#A7F3D0;color:#065F46}
.clb.sell{background:#FFF1F2;border-color:#FECDD3;color:#9F1239}
.vb{width:15px;height:15px;vertical-align:-3px;margin-left:5px}

/* toolbar */
.tb{display:flex;gap:8px;padding:0 18px 10px;flex-wrap:wrap;align-items:center}
.tb input{flex:1 1 180px;min-width:0;border:1px solid var(--gb);border-radius:8px;padding:7px 10px;background:#fff}
.tb input:focus{outline:2px solid var(--goldsoft);border-color:var(--gold)}
.tb input::placeholder{color:#64748B}
.tb .cnt{font-size:12px;color:var(--mut);margin-left:auto;font-weight:600}

/* table */
.tbody{display:flex;flex-direction:column;background:#fff;border-top:1px solid var(--line);min-height:300px;min-width:0}
.tw{flex:1 1 auto;overflow:auto;max-height:520px}
table{width:100%;border-collapse:collapse;min-width:640px}
th{position:sticky;top:0;background:#fff;text-align:left;font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);font-weight:800;padding:10px 12px;border-bottom:2px solid var(--gb);z-index:1;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid #F1F0EE;white-space:nowrap;color:var(--ink)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.num{font-weight:800}
tbody tr{transition:background .15s}
tbody tr:hover td{background:var(--goldtint)}
tr.liverow td{text-align:center;color:var(--mut);font-size:12.5px;padding:18px;border-bottom:0;background:#fff!important}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:800;letter-spacing:.4px;border:1px solid}
.pill.buy{background:#ECFDF5;color:#065F46;border-color:#A7F3D0}
.pill.sell{background:#FFF1F2;color:#9F1239;border-color:#FECDD3}
.txb{display:inline-flex;align-items:center;gap:3px;padding:3px 10px;border:1px solid var(--gb);border-radius:7px;background:#fff;font-size:12px;font-weight:700;transition:.15s}
.txb:hover{background:var(--gold);border-color:var(--gold2);color:var(--ink);box-shadow:0 2px 8px rgba(212,175,55,.35)}
.cc{display:flex;align-items:center;gap:7px;font-weight:700}
.sub{color:var(--mut);font-size:11.5px;display:block;max-width:170px;overflow:hidden;text-overflow:ellipsis}
td:first-child b{display:inline-block;max-width:170px;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
.flash td{animation:fl 6s ease-out}
@keyframes fl{0%{background:#F6E7A8}100%{background:transparent}}
.empty{flex:1;display:none;align-items:center;justify-content:center;padding:30px 18px;text-align:center;color:var(--mut);background:#fff;font-weight:600}
.foot{background:#fff;min-width:0}
.more{display:block;width:calc(100% - 36px);margin:10px 18px}

/* wallets */
details.wl{margin:0;border-top:1px solid var(--line);background:#fff}
details.wl summary{cursor:pointer;padding:10px 18px;font-weight:700;font-size:12.5px;color:var(--mut)}
.wr{display:flex;align-items:center;gap:10px;padding:6px 18px;border-top:1px solid #F1F0EE;font-size:12.5px;flex-wrap:wrap}
.wr .n{font-weight:700}
.wr .ad{color:var(--mut);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px}
.wr .st{margin-left:auto;font-size:11.5px;border-radius:999px;padding:1px 9px;border:1px solid var(--line)}
.st.ok{color:var(--buyink);border-color:#A7F3D0;background:#ECFDF5} .st.err{color:var(--sellink);border-color:#FECDD3;background:#FFF1F2} .st.idle{color:var(--mut)}
.wls{max-height:230px;overflow:auto}
.ib{border:0;background:none;cursor:pointer;color:var(--mut);padding:2px 6px;border-radius:6px}
.ib:hover{background:var(--goldsoft);color:var(--ink)}

/* modal */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.4);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.ov.show{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:470px;padding:22px;border-top:4px solid var(--gold);box-shadow:0 20px 60px rgba(15,23,42,.25)}
.modal h3{margin:0 0 14px;font-size:17px}
.modal label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:12px 0 5px}
.modal input,.modal select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff}
.modal input:focus,.modal select:focus{outline:2px solid var(--goldsoft);border-color:var(--gold)}
.modal .err{color:var(--sellink);font-size:12.5px;min-height:18px;margin-top:8px}
.modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:10px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#fff;color:var(--ink);border:1px solid var(--gold);box-shadow:0 8px 28px rgba(197,155,39,.28);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;font-size:13px}
.toast.show{opacity:1;transform:translateX(-50%)}
footer{padding:12px 22px 28px;color:var(--mut);font-size:12px;text-align:center}
</style>
</head>
<body>

<div id="ticker" class="ticker"></div>

<header class="top">
  <div class="brand">
    <svg viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F1D98A"/><stop offset=".5" stop-color="#D4AF37"/><stop offset="1" stop-color="#B8941F"/></linearGradient></defs><path d="M20 2 37 20 20 38 3 20Z" fill="url(#g)"/><path d="M20 9 31 20 20 31 9 20Z" fill="#fff" opacity=".92"/><path d="M20 14 26 20 20 26 14 20Z" fill="url(#g)"/></svg>
    <div><div class="name">ALIMOVAURA</div><div class="tag" data-i18n="tagline"></div></div>
  </div>
  <div class="sync"><span class="dot" id="syncDot"></span><span id="syncTxt"></span></div>
  <button class="btn" id="btnOlder" data-i18n="older"></button>
  <button class="btn gold" id="btnAdd" data-i18n="addWallet"></button>
  <div class="lang" id="lang">
    <button data-lang="uz">UZ</button><button data-lang="ru">RU</button><button data-lang="en">EN</button>
  </div>
</header>

<div class="aiwrap"><div class="ai" id="ai"></div></div>
<main class="grid" id="grid"></main>

<footer data-i18n="footer"></footer>

<div class="ov" id="ov">
  <form class="modal" id="form" autocomplete="off">
    <h3 id="mTitle" data-i18n="mTitle"></h3>
    <label data-i18n="fAddr"></label>
    <input id="fAddr" required spellcheck="false" placeholder="0x…  /  bc1…">
    <label data-i18n="fLabel"></label>
    <input id="fLabel" required maxlength="40">
    <label data-i18n="fType"></label>
    <select id="fType">
      <option value="inst" data-i18n="tInst"></option>
      <option value="smc" data-i18n="tSmc"></option>
      <option value="exch" data-i18n="tExch"></option>
    </select>
    <div class="err" id="fErr"></div>
    <div class="row">
      <button type="button" class="btn" id="fCancel" data-i18n="cancel"></button>
      <button type="submit" class="btn gold" data-i18n="save"></button>
    </div>
  </form>
</div>
<div class="toast" id="toast"></div>

<script>
(()=>{
'use strict';

/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
/* cache version v3: wipe stale records / cursors written by older buggy builds */
(function migrate(){
  try{
    if(localStorage.getItem('alimovaura_ver')!=='v3'){
      ['aa.tx.v1','aa.meta.v1','alimovaura_tx_v2','alimovaura_meta_v2'].forEach(k=>localStorage.removeItem(k));
      localStorage.setItem('alimovaura_ver','v3');
      try{indexedDB.deleteDatabase('alimovaura')}catch(e){}
    }
  }catch(e){}
})();
const usd=n=>'$'+Math.round(n).toLocaleString('en-US');
const usdC=n=>{const a=Math.abs(n),f=(v,u)=>'$'+(v>=100?v.toFixed(0):v>=10?v.toFixed(1):v.toFixed(2))+u;
  return a>=1e12?f(a/1e12,'T'):a>=1e9?f(a/1e9,'B'):a>=1e6?f(a/1e6,'M'):a>=1e3?f(a/1e3,'K'):'$'+Math.round(a)};
const usdCS=n=>(n<0?'−':'+')+usdC(n);
const usdSigned=n=>(n<0?'−':'+')+usd(Math.abs(n));
const fmtDate=ts=>{const d=new Date(ts*1000);return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const hhmmss=ms=>{const d=new Date(ms);return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`};
const shortAddr=a=>a?(a.length>14?a.slice(0,6)+'…'+a.slice(-4):a):'—';
const fmtPrice=p=>p>=1000?p.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):p>=1?p.toLocaleString('en-US',{maximumFractionDigits:4}):p.toLocaleString('en-US',{maximumFractionDigits:6});
const dayKeyUTC=sec=>new Date(sec*1000).toISOString().slice(0,10);
const dayKeyLocal=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const norm=a=>a&&a.startsWith('0x')?a.toLowerCase():a;
const baseName=l=>String(l).replace(/\s*\(.*\)\s*$/,'').trim();

/* ================= config ================= */
const CFG={
  POLL_MS:60000, STAGGER_MS:1500, BACKFILL_PAGES:3, OLDER_PAGES:4, AUTO_ROUNDS:8, RADAR_INIT_PAGES:6, RADAR_LIVE_PAGES:4, AI_WINDOW:80, SMC_DUST:1000, MAX_AGE_DAYS:90, DISC_EVERY_MS:600000, SMC_TOP:30, BTC_SWEEP_INPUTS:3,
  MIN_INST:10000,             // dust filter for institutional panel
  SMC_MIN:1e6, SMC_MAX:5e7    // strict Smart Money range
};
const STABLES=new Set(['USDT','USDC','DAI','FDUSD','TUSD','USDE','PYUSD','USDS','BUSD','USDP','GUSD','LUSD','FRAX']);
const WRAPPED={WBTC:'BTC',CBBTC:'BTC',TBTC:'BTC',WETH:'ETH',STETH:'ETH',WSTETH:'ETH',CBETH:'ETH',RETH:'ETH'};
const SMC_ALLOW=new Set(['BTC','WBTC','ETH','WETH','SOL','USDT','USDC','LINK','UNI','AAVE','MKR','ONDO','PEPE']);
const AI_ALLOW=new Set([...SMC_ALLOW].filter(x=>!STABLES.has(x)));
const ALIAS={WBTC:'BTC',WETH:'ETH'};
const COINS=[
  {s:'BTC',id:'bitcoin',c:'#F7931A',g:'₿'},{s:'ETH',id:'ethereum',c:'#627EEA',g:'Ξ'},
  {s:'SOL',id:'solana',c:'#9945FF',g:'SOL'},{s:'BNB',id:'binancecoin',c:'#E0A800',g:'BNB'},
  {s:'XRP',id:'ripple',c:'#23292F',g:'XRP'},{s:'TON',id:'the-open-network',c:'#0098EA',g:'TON'}
];
const coinColor=s=>{const k=COINS.find(c=>c.s===s);if(k)return k.c;let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))%360;return `hsl(${h} 45% 42%)`};
const coinIcon=s=>{const k=COINS.find(c=>c.s===s);const g=k?k.g:s.slice(0,2);return `<span class="coin" style="background:${coinColor(s)}">${esc(g)}</span>`};

/* ================= i18n ================= */
const I={
uz:{
  tagline:"Institutsional va Smart Money kripto tahlil terminali",
  addWallet:"+ Hamyon qo'shish", older:"Eski tarixni yuklash",
  panelInst:"INSTITUTSIONAL KITLAR", panelInstSub:"Gigantlar harakati ($1M–$50M): BlackRock, Grayscale va boshqalar",
  panelSmc:"SMART MONEY KITLAR (SMC)", panelSmcSub:"Top 30 ta eng faol Smart Money hamyonlarining jonli harakatlari",
  colCompany:"Kompaniya", colWho:"Kit / Hamyon", colCoin:"Kripto", colAction:"Harakat", colAmount:"Summa (USD)", colDate:"Sana va soat", colProof:"Isbot",
  buy:"SOTIB OLDI", sell:"SOTDI", bought:"Jami sotib olingan", sold:"Jami sotilgan", net:"Sof pul oqimi",

const PROXIES=[u=>`https://corsproxy.io/?${encodeURIComponent(u)}`,u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,u=>`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`];
const proxyMode={};
async function jraw(url,ms){
  const c=new AbortController(); const to=setTimeout(()=>c.abort(),ms);
  try{
    const r=await fetch(url,{signal:c.signal});
    if(!r.ok){const e=new Error('HTTP '+r.status);e.status=r.status;throw e}
    return await r.json();
  }finally{clearTimeout(to)}
}
/* direct first; on CORS/network/403/429/5xx retry via corsproxy.io (then allorigins, codetabs) — public data only; works from file:// and GitHub Pages */
const gateAt={}, GAP={'eth.blockscout.com':220,'mempool.space':250};
async function gate(host){const gap=GAP[host]||120,now=Date.now(),at=Math.max(now,gateAt[host]||0);gateAt[host]=at+gap;if(at>now)await sleep(at-now)}
async function jget(url,ms=15000){
  const host=new URL(url).host; await gate(host);
  const viaFirst=proxyMode[host]&&Date.now()<proxyMode[host];
  const direct=()=>jraw(url,ms);
  const proxied=async()=>{let last;for(const p of PROXIES){try{return await jraw(p(url),ms+5000)}catch(e){last=e}}throw last};
  const retryable=e=>!e.status||e.status===403||e.status===429||e.status>=500;
  if(viaFirst){ try{return await proxied()}catch(e){ return await direct() } }
  try{ return await direct() }
  catch(e){
    if(!retryable(e)) throw e;
    try{ const r=await proxied(); if(!e.status) proxyMode[host]=Date.now()+600000; return r }
    catch(e2){ throw e.status?e:e2 }
  }
}

const BIN_HOSTS=['https://api.binance.com','https://data-api.binance.vision'];
async function loadPrices(){
  const got={}, miss=()=>COINS.filter(c=>!got[c.s]);
  const q=encodeURIComponent(JSON.stringify(COINS.map(c=>c.s+'USDT')));
  /* 1) Binance 24hr (one batched call) */
  for(const h of BIN_HOSTS){
    try{
      const arr=await jget(`${h}/api/v3/ticker/24hr?symbols=${q}`,9000);
      for(const d of arr){const sy=String(d.symbol).replace(/USDT$/,''),p=+d.lastPrice;if(p>0)got[sy]={p,ch:+d.priceChangePercent,src:'Binance'}}
    }catch(e){}
    if(!miss().length) break;
  }
  /* 2) CoinGecko */
  if(miss().length){
    try{
      const d=await jget(`https://api.coingecko.com/api/v3/simple/price?ids=${miss().map(c=>c.id).join(',')}&vs_currencies=usd&include_24hr_change=true`,10000);
      miss().forEach(c=>{const x=d[c.id];if(x&&x.usd)got[c.s]={p:x.usd,ch:x.usd_24h_change||0,src:'CoinGecko'}});
    }catch(e){}
  }
  /* 3) CryptoCompare */
  if(miss().length){
    try{
      const d=await jget(`https://min-api.cryptocompare.com/data/pricemultifull?fsyms=${miss().map(c=>c.s).join(',')}&tsyms=USD`,10000);
      miss().forEach(c=>{const x=d.RAW&&d.RAW[c.s]&&d.RAW[c.s].USD;if(x&&x.PRICE>0)got[c.s]={p:x.PRICE,ch:x.CHANGEPCT24HOUR||0,src:'CryptoCompare'}});
    }catch(e){}
  }
  /* 4) OKX */
  if(miss().length){
    const res=await Promise.allSettled(miss().map(c=>jget(`https://www.okx.com/api/v5/market/ticker?instId=${c.s}-USDT`,8000)));
    miss().forEach((c,i)=>{try{const d=res[i].value.data[0],last=+d.last,open=+d.open24h;if(last>0)got[c.s]={p:last,ch:open>0?(last-open)/open*100:0,src:'OKX'}}catch(e){}});
  }
  if(Object.keys(got).length){ Object.assign(S.prices,got); LS.set('aa.prices',S.prices); }
  renderTicker();
}

function loadHist(sym){
  if(S.hist[sym]&&S.hist[sym].size) return Promise.resolve();
  return S.histP[sym]||(S.histP[sym]=(async()=>{
    const m=new Map();
    for(const h of BIN_HOSTS){
      try{ const arr=await jget(`${h}/api/v3/klines?symbol=${sym}USDT&interval=1d&limit=1000`,12000);
        arr.forEach(k=>m.set(dayKeyUTC(k[0]/1000),(+k[1]+ +k[4])/2)); }catch(e){}
      if(m.size) break;
    }
    if(!m.size){
      let after='';
      try{ for(let i=0;i<3;i++){
        const d=await jget(`https://www.okx.com/api/v5/market/history-candles?instId=${sym}-USDT&bar=1D&limit=100${after?'&after='+after:''}`,10000);
        const arr=d.data||[]; if(!arr.length) break;
        arr.forEach(c=>m.set(dayKeyUTC(+c[0]/1000),(+c[1]+ +c[4])/2)); after=arr[arr.length-1][0];
      }}catch(e){}
    }
    if(m.size) S.hist[sym]=m;
  })().then(()=>{delete S.histP[sym]}));
}
function priceAt(sym,ts){
  const cur=S.prices[sym]&&S.prices[sym].p;
  const m=S.hist[sym];
  if(m){const v=m.get(dayKeyUTC(ts)); if(v) return {p:v,est:false};}
  if(cur){const recent=Date.now()/1000-ts<36*3600; return {p:cur,est:!recent}}
  return null;
}

function mkRec(w,o){
  return {id:o.id,w:w.id,a:norm(w.addr),chain:w.chain,sym:o.sym,side:o.side,amt:o.amt,usd:o.usd,ts:o.ts,hash:o.hash,cp:o.cp||null,est:!!o.est,liq:o.liq?1:0,via0:o.via0||''};
}
function parseBtc(w,tx){
  const A=w.addr, conf=tx.status&&tx.status.confirmed;
  const ts=conf?tx.status.block_time:Math.floor(Date.now()/1000);
  const pr=priceAt('BTC',ts); if(!pr) return [];
  let sent=0,recv=0,ownIn=0; const outs=new Map(), ins=new Map();
  for(const i of tx.vin||[]){const po=i.prevout;if(!po)continue;const a=po.scriptpubkey_address;
    if(a===A){sent+=po.value;ownIn++}else if(a)ins.set(a,(ins.get(a)||0)+po.value)}
  for(const o of tx.vout||[]){const a=o.scriptpubkey_address;
    if(a===A)recv+=o.value;else if(a)outs.set(a,(outs.get(a)||0)+o.value)}
  const skip=sameGroup(w);
  const rec=(cp,sats,side,key)=>{
    const btc=sats/1e8;
    return mkRec(w,{id:`${w.id}:${tx.txid}${key?':'+key:''}`,sym:'BTC',amt:btc,usd:btc*pr.p,ts,hash:tx.txid,cp,est:pr.est,side});
  };
  if(w.type==='exch'){                       /* exchange probe: one row per counterparty */
    let dirOut,parts;
    if(sent>0){parts=outs;dirOut=true}else if(recv>0){parts=ins;dirOut=false}else return [];
    const had=parts.size; for(const a of skip) parts.delete(a);
    if(dirOut&&parts.size===0) return [];
    if(!dirOut&&had>0&&parts.size===0) return [];
    return [...parts].map(([cp,sats])=>rec(cp,sats,dirOut?'buy':'sell',cp));
  }
  /* institution / smart-money wallet: NET flow of the address (change outputs cancel out) */
  const net=recv-sent;
  if(net>0){                                  /* net inflow -> BUY */
    const senders=new Map(ins); for(const a of skip) senders.delete(a);
    if(ins.size>0&&senders.size===0) return [];
    let top=null,tv=0; for(const [a,v] of senders) if(v>tv){tv=v;top=a}
    return [rec(top,net,'buy','')];
  }
  if(net<0){                                  /* net outflow to OTHER addresses -> SELL */
    const parts=new Map(outs); for(const a of skip) parts.delete(a);
    let ext=0,top=null,tv=0; for(const [a,v] of parts){ext+=v;if(v>tv){tv=v;top=a}}
    if(ext<=0) return [];
    if(recv===0&&ownIn>=CFG.BTC_SWEEP_INPUTS&&parts.size<=1) return [];   /* consolidation / sweep to a custody address */
    return [rec(top,ext,'sell','')];
  }
  return [];
}
function parseEthInt(w,t){
  if(t.success===false||t.error) return null;
  let wei; try{wei=BigInt(t.value||'0')}catch(e){return null}
  if(wei===0n) return null;
  const hash=t.transaction_hash||(t.transaction&&t.transaction.hash); if(!hash) return null;
  const from=norm(t.from&&t.from.hash), to=norm(t.to&&t.to.hash), A=norm(w.addr);
  if(!from||!to||from===to) return null;
  const out=from===A, cp=out?to:from;
  if(sameGroup(w).includes(cp)) return null;
  const ts=Math.floor(Date.parse(t.timestamp)/1000); if(!ts) return null;
  const pr=priceAt('ETH',ts); if(!pr) return null;
  const eth=Number(wei)/1e18;
  return mkRec(w,{id:`${w.id}:${hash}:i${t.index??''}`,sym:'ETH',amt:eth,usd:eth*pr.p,ts,hash,cp,est:pr.est,via0:viaOf(out?t.to:t.from),
    side:w.type==='exch'?(out?'buy':'sell'):(out?'sell':'buy')});
}
function parseEthTx(w,t){
  if(t.status==='error'||(t.result&&/fail|error|revert/i.test(t.result))) return null;
  let wei; try{wei=BigInt(t.value||'0')}catch(e){return null}
  if(wei===0n) return null;
  const from=norm(t.from&&t.from.hash), to=norm(t.to&&t.to.hash), A=norm(w.addr);
  if(!from||!to||from===to) return null;
  const out=from===A, cp=out?to:from;
  if(sameGroup(w).includes(cp)) return null;
  const ts=Math.floor(Date.parse(t.timestamp)/1000); if(!ts) return null;
  const pr=priceAt('ETH',ts); if(!pr) return null;
  const eth=Number(wei)/1e18;
  return mkRec(w,{id:`${w.id}:${t.hash}`,sym:'ETH',amt:eth,usd:eth*pr.p,ts,hash:t.hash,cp,est:pr.est,via0:viaOf(out?t.to:t.from),
    side:w.type==='exch'?(out?'buy':'sell'):(out?'sell':'buy')});
}
const viaOf=a=>{const l=addrLabel(a);return(DEX_RE.test(l)||EXCH_RE.test(l))?l.slice(0,28):''};
function parseTok(w,t){
  const tok=t.token||{}; const sym=(tok.symbol||'').trim().toUpperCase();
  if(!sym||(tok.type&&tok.type!=='ERC-20')) return null;
  const isStable=STABLES.has(sym);
  if(isStable&&w.type!=='smc') return null;
  const hash=t.transaction_hash||t.tx_hash; if(!hash) return null;
  const from=norm(t.from&&t.from.hash), to=norm(t.to&&t.to.hash), A=norm(w.addr);
  if(!from||!to||from===to) return null;
  const out=from===A, cp=out?to:from;
  if(sameGroup(w).includes(cp)) return null;
  const ts=Math.floor(Date.parse(t.timestamp)/1000); if(!ts) return null;
  const tot=t.total||{}; let raw; try{raw=BigInt(tot.value||'0')}catch(e){return null}
  const dec=parseInt(tot.decimals??tok.decimals??18,10);
  const amt=Number(raw)/Math.pow(10,dec); if(!(amt>0)) return null;
  /* spoof guard: well-known symbols must be the real contract; unknown tokens must be liquid */
  const known=RADAR_TOKENS.find(k=>k[0]===sym), ta=String(tok.address_hash||tok.address||'').toLowerCase();
  let liq=false;
  if(known){ if(ta?ta!==known[1].toLowerCase():isStable) return null; }
  else if(isStable) return null;
  else{
    const rate=+tok.exchange_rate, vol=+tok.volume_24h||0, mc=+tok.circulating_market_cap||0;
    if(!(rate>0)||!(vol>=2e6||mc>=1e8)) return null;
    liq=true;
  }
  let price=null,est=true;
  const wb=WRAPPED[sym];
  if(isStable){price=1;est=false}
  else if(wb){const pr=priceAt(wb,ts);if(pr){price=pr.p;est=pr.est}}
  else if(tok.exchange_rate!=null&&+tok.exchange_rate>0) price=+tok.exchange_rate;
  if(!price) return null;
  return mkRec(w,{id:`${w.id}:${hash}:${t.log_index??sym}`,sym:sym.slice(0,8),amt,usd:amt*price,ts,hash,cp,est,liq,via0:viaOf(out?t.to:t.from),
    side:w.type==='exch'?(out?'buy':'sell'):(out?'sell':'buy')});
}

/* ================= fetching ================= */
async function fetchBtc(w,mode){
  const m=meta(w.id), base=`https://mempool.space/api/address/${w.addr}`;
  const out=[]; let last=null, pages;
  if(mode==='older'){ if(!m.btcCursor||m.btcEnd) return out; last=m.btcCursor; pages=CFG.OLDER_PAGES; }
  else pages=mode==='init'?CFG.BACKFILL_PAGES:1;
  for(let p=0;p<pages;p++){
    const arr=await jget(last?`${base}/txs/chain/${last}`:`${base}/txs`);
    if(!Array.isArray(arr)||!arr.length){ if(mode!=='live') m.btcEnd=true; break; }
    out.push(...arr);
    const conf=arr.filter(x=>x.status&&x.status.confirmed);
    if(!conf.length){ if(mode!=='live') m.btcEnd=true; break; }
    last=conf[conf.length-1].txid;
    if(mode!=='live') m.btcCursor=last;
    if(conf.length<25){ if(mode!=='live') m.btcEnd=true; break; }
    if(p<pages-1) await sleep(700);
  }
  return out;
}
async function fetchEth(w,mode){
  const m=meta(w.id); m.next=m.next||{}; m.end=m.end||{};
  const base=`https://eth.blockscout.com/api/v2/addresses/${w.addr}`;
  const kinds=(w.type==='exch'||w.auto)?['transactions','token-transfers']:['transactions','internal-transactions','token-transfers'];
  const res={}; kinds.forEach(k=>res[k]=[]); let fails=0;
  for(const kind of kinds){
    try{
      let np=null,pages;
      if(mode==='older'){ if(m.end[kind]||!m.next[kind]) continue; np=m.next[kind]; pages=CFG.OLDER_PAGES; }
      else pages=mode==='init'?(w.auto?1:CFG.BACKFILL_PAGES):1;
      for(let p=0;p<pages;p++){
        const q=new URLSearchParams();
        if(kind==='token-transfers') q.set('type','ERC-20');
        if(np) for(const [k,v] of Object.entries(np)) if(v!=null) q.set(k,v);
        const qs=q.toString();
        const d=await jget(`${base}/${kind}${qs?'?'+qs:''}`);
        res[kind].push(...(d.items||[]));
        np=d.next_page_params||null;
        if(mode!=='live'){ m.next[kind]=np; if(!np) m.end[kind]=true; }
        if(!np) break;
        await sleep(800);
      }
    }catch(e){ fails++; if(kind==='transactions'&&fails&&mode!=='older') {/* try tokens anyway */} res.err=e; }
    await sleep(500);
  }
  if(fails===kinds.length) throw res.err||new Error('fetch failed');
  return res;
}
const passIngest=(w,r)=>(r.ts*1000>Date.now()-CFG.MAX_AGE_DAYS*864e5&&r.ts*1000<Date.now()+6e5)&&(w.type==='inst'
  ?(SMC_ALLOW.has(r.sym)&&r.usd>=CFG.SMC_MIN&&r.usd<=CFG.SMC_MAX)            /* institutions: strict $1M-$50M */
  :((SMC_ALLOW.has(r.sym)||r.liq)&&r.usd>=CFG.SMC_DUST&&r.usd<=1e9));        /* smart money: every real trade */
async function syncWallet(w,mode){
  const m=meta(w.id);
  await Promise.all([loadHist('BTC'),loadHist('ETH')]);
  let recs=[];
  if(w.chain==='BTC'){ (await fetchBtc(w,mode)).forEach(tx=>recs.push(...parseBtc(w,tx))); }
  else{
    const o=await fetchEth(w,mode);
    o.transactions.forEach(x=>recs.push(parseEthTx(w,x)));
    (o['internal-transactions']||[]).forEach(x=>recs.push(parseEthInt(w,x)));
    o['token-transfers'].forEach(x=>recs.push(parseTok(w,x)));
  }
  const add=[]; let created=0;
  for(const r of recs){
    if(!r||!passIngest(w,r)) continue;
    const had=S.txs.has(r.id); S.txs.set(r.id,r); add.push(r);
    if(!had){created++; if(m.initDone&&mode==='live') S.fresh.set(r.id,Date.now());}
  }
  await DB.put(add);
  if(mode==='init') m.initDone=true;
  return created;
}
const active=()=>S.wallets.filter(w=>w.addr&&w.chain);
const historyDone=(m,w)=>w.chain==='BTC'?!!m.btcEnd:!!(m.end&&m.end.transactions&&m.end['token-transfers']);

async function pool(tasks,n){
  let i=0;
  await Promise.all(Array.from({length:Math.min(n,tasks.length)},async()=>{
    while(i<tasks.length){const job=tasks[i++];try{await job()}catch(e){}await sleep(150)}
  }));
}
async function syncOneWallet(w){
  const m=meta(w.id);
  if(m.skip>0){m.skip--;S.attempted.add(w.id);return}
  try{
    await syncWallet(w,m.initDone?'live':'init');
    m.err=0;m.error=null;m.lastOk=Date.now();S.lastLive=Date.now();
  }catch(e){ m.err=(m.err||0)+1; m.error=e.message||String(e); m.skip=Math.min(2**m.err-1,8); }
  S.attempted.add(w.id); saveMeta(); render();
}
async function bgHistory(){          /* automatic deep history, runs in the background */
  if(S.bgRunning) return; S.bgRunning=true;
  try{
    for(let pass=0;pass<CFG.AUTO_ROUNDS;pass++){
      let did=false;
      for(const w of active()){
        const m=meta(w.id);
        if(w.auto||!m.initDone||(m.auto||0)>=CFG.AUTO_ROUNDS) continue;
        if(historyDone(m,w)){m.auto=CFG.AUTO_ROUNDS;continue}
        try{ await syncWallet(w,'older'); }catch(e){}
        m.auto=(m.auto||0)+1; did=true; saveMeta(); render(); await sleep(400);
      }
      if(!did) break;
    }
  }catch(e){}
  S.bgRunning=false;
}
async function syncCycle(){
  if(S.busy) return; S.busy=true; paintStatus();
  try{
    if(!S.prices.BTC||!S.prices.ETH) await loadPrices();
    /* all tracked wallets + whale radar fetched concurrently (3 at a time, per-host throttled) */
    if(discDue()) await syncRadar();
    await pool(active().map(w=>()=>syncOneWallet(w)),3);
  }catch(e){}

async function loadOlder(){
  if(S.busy){return}
  S.busy=true; paintStatus(); $('#btnOlder').disabled=true; let total=0;

/* direction: exchange -> wallet = BUY, wallet -> exchange = SELL; EOA <-> DEX contract: receives token = BUY, sends token = SELL */
function classify(from,to){
  if(!from||!to||!from.hash||!to.hash) return null;
  const fl=addrLabel(from), tl=addrLabel(to);
  const fe=EXCH_RE.test(fl)||EXCH_ADDR.has(norm(from.hash)), te=EXCH_RE.test(tl)||EXCH_ADDR.has(norm(to.hash));   /* exchange<->exchange (internal hot-wallet moves) => no match => dropped */
  if(fe&&!te) return {whale:to,side:'buy',via:fl};
  if(te&&!fe) return {whale:from,side:'sell',via:tl};
  if(!fe&&!te){
    if(DEX_RE.test(tl)&&to.is_contract&&!from.is_contract) return {whale:from,side:'sell',via:tl};
    if(DEX_RE.test(fl)&&from.is_contract&&!to.is_contract) return {whale:to,side:'buy',via:fl};
  }
  return null;

/* rank real on-chain traders (EOAs swapping on DEXs / moving liquid tokens) by recent traded volume -> top 30 watchlist */
async function syncRadar(){
  await Promise.all([loadHist('ETH'),loadHist('BTC')]);
  const B='https://eth.blockscout.com/api/v2', agg=new Map();
  const okTrader=a=>a&&a.hash&&!a.is_contract&&!EXCH_RE.test(addrLabel(a))&&!EXCH_ADDR.has(norm(a.hash));
  const bump=(a,usdv)=>{const k=a.hash.toLowerCase(),e=agg.get(k)||{n:0,usd:0,lab:''};e.n++;e.usd+=usdv;if(!e.lab)e.lab=(a.ens_domain_name||a.name||'').slice(0,28);agg.set(k,e)};
  const jobs=[
    ...RADAR_TOKENS.map(([sym,addr])=>({url:`${B}/tokens/${addr}/transfers`,kind:'tok',fb:sym})),
    {url:`${B}/token-transfers?type=ERC-20`,kind:'tok'},
    ...ROUTERS.map(([a])=>({url:`${B}/addresses/${a}/transactions`,kind:'router'}))
  ];
  let ok=0;
  await pool(jobs.map(job=>async()=>{
    try{
      let np=null;
      for(let p=0;p<3;p++){
        const q=new URLSearchParams(); if(np) for(const [k,v] of Object.entries(np)) if(v!=null) q.set(k,v);
        const qs=q.toString(), d=await jget(job.url+(qs?(job.url.includes('?')?'&':'?')+qs:''));
        for(const it of d.items||[]){
          if(job.kind==='tok'){
            const f=it.from,t2=it.to; if(!f||!t2) continue;
            const tr=(!f.is_contract&&t2.is_contract)?f:((!t2.is_contract&&f.is_contract)?t2:null);
            if(okTrader(tr)) bump(tr,tokenUsd(it,job.fb));
          }else if(okTrader(it.from)){
            let wei=0n; try{wei=BigInt(it.value||'0')}catch(e){}
            bump(it.from,(S.prices.ETH?Number(wei)/1e18*S.prices.ETH.p:0));
          }
        }
        np=d.next_page_params||null; if(!np) break;
      }
      ok++;
    }catch(e){S.radar.err=e.message||String(e)}
  }),3);
  if(ok){
    const disc=S.meta.disc||(S.meta.disc={});
    for(const k in disc){disc[k].n*=0.85;disc[k].usd*=0.85}
    for(const [k,e] of agg){const d=disc[k]||(disc[k]={n:0,usd:0,lab:''});d.n+=e.n;d.usd+=e.usd;if(e.lab)d.lab=e.lab}
    const ranked=Object.entries(disc).filter(([,d])=>d.n>=2).sort((a,b)=>(b[1].usd-a[1].usd)||(b[1].n-a[1].n));
    for(const [k] of Object.entries(disc).filter(x=>!ranked.slice(0,150).some(r=>r[0]===x[0]))) delete disc[k];
    const rank=new Map(ranked.map(([k],i)=>[k,i]));
    const manual=S.wallets.filter(w=>!w.auto), taken=new Set(manual.map(w=>norm(w.addr)).filter(Boolean).map(a=>a.toLowerCase()));
    const cur=S.wallets.filter(w=>w.auto);
    const keep=cur.filter(w=>(rank.get(w.addr.toLowerCase())??999)<CFG.SMC_TOP+15);     /* hysteresis: avoid flapping */
    const keepSet=new Set(keep.map(w=>w.addr.toLowerCase())), add=[];
    for(const [k,d] of ranked){
      if(keep.length+add.length>=CFG.SMC_TOP) break;
      if(keepSet.has(k)||taken.has(k)) continue;
      add.push({id:'a_'+k.slice(2,12),label:d.lab||shortAddr(k),addr:k,chain:'ETH',type:'smc',auto:true});
    }
    for(const w of cur) if(!keep.includes(w)) delete S.meta[w.id];
    S.wallets=[...manual,...keep,...add];
    saveWallets(); S.meta.discLast=Date.now();
    S.radar.ok=ok; S.radar.err=null; S.radar.last=Date.now(); S.lastLive=Date.now();
  }
  S.radarTried=true; saveMeta(); render();
}

function streakSignals(list){
  const now=new Date(), days=[];
  for(let i=0;i<7;i++){const d=new Date(now);d.setDate(d.getDate()-i);days.push(dayKeyLocal(d))}
  const coins=new Map();
  for(const x of list){
    const di=days.indexOf(dayKeyLocal(new Date(x.ts*1000))); if(di<0) continue;
    let c=coins.get(x.sym);
    if(!c){c={net:Array(7).fill(0),buy:Array(7).fill(0),sell:Array(7).fill(0),by:Array.from({length:7},()=>new Map())};coins.set(x.sym,c)}
    const v=x.side==='buy'?x.usd:-x.usd;
    c.net[di]+=v; if(v>0)c.buy[di]+=x.usd; else c.sell[di]+=x.usd;
    const who=x.pk==='smc'?SMCK:baseName(x.who);
    c.by[di].set(who,(c.by[di].get(who)||0)+v);
  }
  const out=[];
  for(const [sym,c] of coins){
    const start=c.net[0]!==0?0:1, sign=Math.sign(c.net[start]||0); if(!sign) continue;
    let n=0,total=0,end=start,bb=0,ss=0;
    for(let i=start;i<7;i++){ if(Math.sign(c.net[i])===sign){n++;total+=Math.abs(c.net[i]);bb+=c.buy[i];ss+=c.sell[i];end=i} else break; }
    if(n<3) continue;
    const comp=new Map();
    for(let i=start;i<=end;i++) for(const [k,v] of c.by[i]) comp.set(k,(comp.get(k)||0)+v);
    const win=[...comp].filter(([,v])=>Math.sign(v)===sign).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).map(([k])=>k);
    const p=Math.max(65,Math.min(85,Math.round(65+Math.min(10,(n-3)*2.5)+Math.min(10,Math.log10(Math.max(total,1e6)/1e6)*4))));
    out.push({kind:'streak',sym,dir:sign>0?'bull':'bear',n,total,p,s:Math.round(ss/Math.max(bb+ss,1)*100),names:win.filter(k=>k!==SMCK),smc:win.includes(SMCK)});
  }
  return out.sort((a,b)=>b.total-a.total);
}
/* most recent N moves per coin, regardless of calendar gaps: dominant direction + probability */
function windowSignals(list){
  const win=[...list].sort((a,b)=>b.ts-a.ts).slice(0,CFG.AI_WINDOW), by=new Map();
  for(const x of win){
    let c=by.get(x.sym); if(!c){c={sym:x.sym,buy:0,sell:0,k:0,t0:x.ts,t1:x.ts,w:new Map()};by.set(x.sym,c)}
    c.k++; if(x.side==='buy')c.buy+=x.usd; else c.sell+=x.usd;
    c.t0=Math.min(c.t0,x.ts); c.t1=Math.max(c.t1,x.ts);
    const who=x.pk==='smc'?SMCK:baseName(x.who); c.w.set(who,(c.w.get(who)||0)+(x.side==='buy'?x.usd:-x.usd));
  }
  return [...by.values()].map(c=>{
    const tot=c.buy+c.sell, share=c.buy/Math.max(tot,1), net=c.buy-c.sell;
    const dir=share>=0.55?'bull':share<=0.45?'bear':'flat';
    const dom=dir==='bear'?1-share:share;
    const p=dir==='flat'?65:Math.max(65,Math.min(85,Math.round(65+(dom-0.5)*40*Math.min(1,c.k/8)+Math.min(5,c.k/4))));   /* small samples = lower confidence */
    const sign=dir==='bear'?-1:1;
    const nm=[...c.w].filter(([,v])=>Math.sign(v)===sign).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).map(([k])=>k);
    return {kind:'win',sym:c.sym,dir,k:c.k,net,total:dir==='bear'?c.sell:c.buy,sh:Math.round(dom*100),b:Math.round(share*100),s:100-Math.round(share*100),p,
      names:nm.filter(k=>k!==SMCK),smc:nm.includes(SMCK),range:fmtDay(c.t0)+'–'+fmtDay(c.t1)};
  });
}
function analyze(list){
  const real=list.filter(x=>AI_ALLOW.has(x.sym)&&x.usd>=CFG.SMC_DUST&&x.usd<=1e9&&x.ts>Date.now()/1000-CFG.MAX_AGE_DAYS*86400).map(x=>({...x,sym:ALIAS[x.sym]||x.sym}));
  const st=streakSignals(real), used=new Set(st.slice(0,2).map(s=>s.sym));
  const ws=windowSignals(real);
  const rest=ws.filter(s=>!used.has(s.sym)).sort((a,b)=>Math.abs(b.net)-Math.abs(a.net));
  return {signals:[...st.slice(0,2),...rest].slice(0,3),
    chips:ws.map(c=>({sym:c.sym,net:c.net})).sort((a,b)=>Math.abs(b.net)-Math.abs(a.net)).slice(0,5)};
}
function actorsText(sg){
  const parts=[...new Set(sg.names.map(baseName))].slice(0,2);
  if(sg.smc) parts.push(t('actSmc'));
  if(!parts.length) return t('fallbackActors');
  return parts.length===1?parts[0]:parts.slice(0,-1).join(', ')+` ${t('and')} `+parts[parts.length-1];
}
function clusters(list){
  const cut=Date.now()/1000-CLUSTER_H*3600, g=new Map();
  for(const x of list){
    if(x.ts<cut||STABLES.has(x.sym)) continue;
    const key=x.sym+'|'+x.side; let e=g.get(key); if(!e){e={sym:x.sym,side:x.side,w:new Set(),usd:0};g.set(key,e)}
    e.w.add(x.who); e.usd+=x.usd;
  }
  return [...g.values()].filter(e=>e.w.size>=CLUSTER_MIN).sort((a,b)=>b.usd-a.usd);
}
const whoOf=x=>{const w=S.wallets.find(q=>q.id===x.w);if(!w)return '';
  return w.type==='exch'?shortAddr(x.cp):w.label};
function visible(panel){
  const P=PANELS[panel], v=S.view[panel], cut=v.period==='24h'?864e2:v.period==='7d'?6048e2:v.period==='30d'?2592e3:0;
  const nowS=Date.now()/1000, byId=new Map(S.wallets.map(w=>[w.id,w]));
  const out=[];
  const minTs=nowS-CFG.MAX_AGE_DAYS*86400;
  for(const x of S.txs.values()){
    if(x.w==='radar'||!(x.ts>minTs)||x.ts>nowS+600) continue;               /* drop corrupted / outdated timestamps */
    const w=byId.get(x.w); if(!w||!w.addr||norm(w.addr)!==x.a||!P.types.includes(w.type)) continue;
    if(panel==='inst'){ if(!SMC_ALLOW.has(x.sym)||x.usd<CFG.SMC_MIN||x.usd>CFG.SMC_MAX) continue; }   /* institutions: strict $1M-$50M */
    else if(!(SMC_ALLOW.has(x.sym)||x.liq)||x.usd<CFG.SMC_DUST||x.usd>1e9) continue;                  /* smart money: no $1M minimum */
    x.who=whoOf(x); x.via=w.type==='exch'?w.label:(x.via0||''); x.pk=panel; x.co=baseName(w.label); x.verified=!!(w.builtin&&!w.slot&&!w.unv);
    out.push(x);
  }
  out.sort((a,b)=>b.ts-a.ts||(a.id<b.id?1:-1));       /* strictly newest first */
  const seen=new Set(), ded=[];
  for(const x of out){const key=x.w+'|'+x.hash+'|'+x.sym+'|'+x.side+'|'+Math.round(x.usd/1000);if(seen.has(key))continue;seen.add(key);ded.push(x)}
  return {all:ded,period:cut?ded.filter(x=>nowS-x.ts<=cut):ded};
}

  if(s.kind==='win'){
    if(s.dir==='flat') return t('aiFlat',{coin:s.sym,k:s.k,b:s.b,s:s.s,p:s.p});
    return t(s.dir==='bull'?'aiWinBull':'aiWinBear',{k:s.k,range:s.range,actors:actorsText(s),coin:s.sym,usd:usd(s.total),sh:s.sh,p:s.p});
  }
  return t(s.dir==='bull'?'aiBull':'aiBear',{n:s.n,actors:actorsText(s),coin:s.sym,usd:usd(s.total),p:s.p,s:s.s});
}

function paintVoice(){
  $$('[data-act="speak"]').forEach(b=>{const on=S.speaking===b.dataset.k;b.classList.toggle('on',on);b.querySelector('.vl').textContent=t(on?'stop':'listen')});

function speak(k){
  if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined'){toast(t('noSpeech'));return}
  if(S.speaking===k){speechSynthesis.cancel();S.speaking=null;paintVoice();return}
  speechSynthesis.cancel();
  const text=S.aiText[k]; if(!text) return;
  const u=new SpeechSynthesisUtterance(text);
  const voices=speechSynthesis.getVoices()||[];
  let v=voices.find(x=>x.lang.toLowerCase().startsWith(lang));
  if(!v&&lang==='uz'){v=voices.find(x=>/^(tr|kk|az|ky|tk)/i.test(x.lang));toast(t(v?'voiceFallback':'noVoice'))}
  if(v){u.voice=v;u.lang=v.lang}else u.lang={uz:'uz-UZ',ru:'ru-RU',en:'en-US'}[lang];
  u.rate=.95;
  u.onend=u.onerror=()=>{if(S.speaking===k){S.speaking=null;paintVoice()}};
  S.speaking=k; paintVoice(); speechSynthesis.speak(u);
}

  if(S.wallets.some(w=>w.addr&&norm(w.addr)===norm(addr))){$('#fErr').textContent=t('eDup');return}
  let w;
  if(editSlot){ w=S.wallets.find(x=>x.id===editSlot.id); w.addr=addr; w.chain=chain; delete S.meta[w.id]; }
  else{ w={id:'c'+Date.now().toString(36),label,addr,chain,type:$('#fType').value}; S.wallets.push(w); }
  saveWallets(); saveMeta(); closeModal(); toast(t('added')); render();
  if(!S.busy) syncOne(w); else setTimeout(()=>syncOne(w),CFG.POLL_MS/2);
});
async function syncOne(w){
  const m=meta(w.id);
  try{ if(!S.prices.BTC) await loadPrices(); await syncWallet(w,m.initDone?'live':'init'); m.err=0;m.error=null;m.lastOk=Date.now();S.lastLive=Date.now() }
  catch(e){ m.err=1; m.error=e.message||String(e) }
  saveMeta(); render();
}
$('#fCancel').addEventListener('click',closeModal);
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
$('#btnAdd').addEventListener('click',()=>openModal());
$('#btnOlder').addEventListener('click',loadOlder);
$('#lang').addEventListener('click',e=>{
  const b=e.target.closest('[data-lang]'); if(!b) return;
  lang=b.dataset.lang; LS.set('aa.lang',lang);
  if('speechSynthesis' in window){speechSynthesis.cancel();S.speaking=null}
  applyI18n(); doRender();
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, k=b.dataset.k, id=b.dataset.id;
  if(act==='speak') speak(k);
  else if(act==='more'){S.view[k].limit+=100;render()}
  else if(act==='pill'){const v=S.view[k];v[b.dataset.kind]=b.dataset.v;v.limit=100;render()}
  else if(act==='aitoggle'){S.aiOpen=!S.aiOpen;LS.set('aa.aiOpen',S.aiOpen);render()}
  else if(act==='setaddr') openModal(S.wallets.find(w=>w.id===id));
  else if(act==='rm'){
    const w=S.wallets.find(x=>x.id===id); if(!w) return;
    if(w.slot){w.addr='';w.chain=null} else S.wallets=S.wallets.filter(x=>x.id!==id);
    delete S.meta[id]; saveWallets(); saveMeta(); render();
  }
});

/* ================= toast ================= */
let tt=0;
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),3800)}

/* ================= boot ================= */
(async function init(){
  saveWallets(); buildShell(); applyI18n(); renderTicker(); doRender();
  if('speechSynthesis' in window) try{speechSynthesis.getVoices()}catch(e){}
  await DB.open();
  const saved=await DB.all(); const minTs=Date.now()/1000-CFG.MAX_AGE_DAYS*86400;
  saved.forEach(x=>{ if(x.w!=='radar'&&x.ts>minTs&&x.ts<Date.now()/1000+600) S.txs.set(x.id,x) });
  S.loaded=true; doRender();
  loadPrices().catch(()=>{}); setInterval(()=>loadPrices().catch(()=>{}),20000);
  syncCycle(); setInterval(syncCycle,CFG.POLL_MS);
  setInterval(paintStatus,1000);
})();

})();
</script>
</body>
