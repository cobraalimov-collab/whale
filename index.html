<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALIMOVAURA — Institutsional va Smart Money terminali</title>
<style>
:root{
  --bg:#FFFFFF; --card:#F8FAFC; --line:#E5E7EB; --gb:#E5D399; --ink:#0F172A; --mut:#64748B;
  --gold:#D4AF37; --gold2:#B8860B; --goldsoft:#FBF6E4;
  --buy:#059669; --buyink:#059669; --sell:#DC2626; --sellink:#DC2626;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.45}
button,select,input{font:inherit;color:inherit}
a{color:var(--gold2);text-decoration:none;font-weight:600}
a:hover{text-decoration:underline}

/* ticker */
.ticker{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--line);background:#fff;scrollbar-width:none}
.ticker::-webkit-scrollbar{display:none}
.tk{display:flex;align-items:center;gap:8px;padding:9px 18px;border-right:1px solid var(--line);white-space:nowrap;flex:1 0 auto;justify-content:center}
.tk .sym{font-weight:700}
.tk .px{font-variant-numeric:tabular-nums}
.tk .ch{font-variant-numeric:tabular-nums;font-weight:600;font-size:12.5px}
.up{color:var(--buyink)} .down{color:var(--sellink)}
.coin{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:9px;font-weight:800;color:#fff;flex:none;letter-spacing:-.3px}

/* header */
.top{display:flex;align-items:center;gap:16px;padding:14px 22px;border-bottom:2px solid transparent;border-image:linear-gradient(90deg,var(--gold),#F1D98A,var(--gold2)) 1;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.brand svg{width:34px;height:34px}
.brand .name{font-size:22px;font-weight:800;letter-spacing:2.4px;background:linear-gradient(90deg,#B8941F,#D4AF37 45%,#C5A028);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .tag{font-size:11.5px;color:var(--mut);letter-spacing:.3px;margin-top:-2px}
.sync{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--buy);display:inline-block}
.dot.busy{background:var(--gold);animation:pulse 1s infinite}
.dot.err{background:var(--sell)}
.sync b{color:var(--ink)}
@keyframes pulse{50%{opacity:.25}}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600;transition:.15s}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:linear-gradient(180deg,#DDB93F,#C5A028);border-color:#B8941F;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.15)}
.btn.gold:hover{filter:brightness(1.05)}
.btn:disabled{opacity:.5;cursor:default}
.lang{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.lang button{border:0;background:#fff;padding:8px 12px;cursor:pointer;font-weight:700;color:var(--mut)}
.lang button.on{background:var(--goldsoft);color:var(--gold2)}

/* layout */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:18px 22px 10px;align-items:start}
@media(max-width:1180px){.grid{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--gb);border-radius:14px;overflow:hidden;min-width:0}
.ph{display:flex;align-items:flex-start;gap:12px;padding:16px 18px 10px;flex-wrap:wrap}
.ph h2{margin:0;font-size:16px;letter-spacing:1.4px;font-weight:800}
.ph h2 em{font-style:normal;color:var(--gold2)}
.ph p{margin:2px 0 0;color:var(--mut);font-size:12.5px}

.sel{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 8px;cursor:pointer}

/* AI */
.aiwrap{padding:18px 22px 0}
.aiwrap .ai{margin:0}
.ai{margin:0 18px 12px;background:#fff;border:1px solid var(--gold);border-radius:12px;padding:12px 14px;box-shadow:0 0 0 3px var(--goldsoft)}
.aih{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.aih b{font-size:12px;letter-spacing:1.2px;color:var(--gold2)}
.aih .btn{margin-left:auto;padding:5px 11px;display:flex;align-items:center;gap:6px;font-size:13px}
.aih .btn svg{width:15px;height:15px}
.aih .btn.on{background:var(--goldsoft);border-color:var(--gold)}
.ai ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.ai li{padding-left:12px;border-left:3px solid var(--line)}
.ai li.bull{border-color:var(--buy)} .ai li.bear{border-color:var(--sell)}
.ai li .bar{height:4px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden;max-width:260px}
.ai li .bar i{display:block;height:100%}
.ai li.bull .bar i{background:var(--buy)} .ai li.bear .bar i{background:var(--sell)}
.ai .none{color:var(--mut)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.chip{font-size:11.5px;border:1px solid var(--line);border-radius:20px;padding:2px 9px;background:var(--card);font-variant-numeric:tabular-nums}
.disc{font-size:11px;color:var(--mut);margin-top:8px}

/* flow strip */
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 18px 12px}
.flow div{background:#fff;border:1px solid var(--gb);border-radius:10px;padding:8px 12px}
.flow small{display:block;color:var(--mut);font-size:11.5px}
.flow b{font-size:17px;font-variant-numeric:tabular-nums}

/* toolbar / pills / bars */
.tb{display:flex;gap:8px;padding:0 18px 10px;flex-wrap:wrap;align-items:center}
.tb input{flex:1 1 200px;min-width:0;border:1px solid var(--gb);border-radius:8px;padding:7px 10px;background:#fff}
.tb input:focus{outline:2px solid var(--goldsoft);border-color:var(--gold)}
.tb .cnt{font-size:11.5px;color:var(--mut);margin-left:auto}
.pills{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px 10px;align-items:center}
.pills .lb{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin-right:2px}
.pl{border:1px solid var(--gb);background:#fff;border-radius:20px;padding:3px 12px;cursor:pointer;font-size:12.5px;font-weight:600}
.pl:hover{border-color:var(--gold)}
.pl.on{background:linear-gradient(180deg,#DDB93F,#B8860B);color:#fff;border-color:#B8860B}
.balwrap{margin:0 18px 12px}
.bal{display:flex;height:10px;border-radius:10px;overflow:hidden;background:var(--line)}
.bal i{display:block;height:100%;transition:width .4s}
.bal .g{background:var(--buy)} .bal .r{background:var(--sell)}
.bl{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-top:4px}
.clu{display:flex;flex-direction:column;gap:6px;margin:0 18px 12px}
.clb{border-radius:10px;padding:8px 12px;font-weight:800;letter-spacing:.4px;border:1px solid}
.clb small{display:block;font-weight:500;letter-spacing:0;color:var(--mut)}
.clb.buy{background:rgba(5,150,105,.08);border-color:rgba(5,150,105,.45);color:var(--buy)}
.clb.sell{background:rgba(220,38,38,.07);border-color:rgba(220,38,38,.45);color:var(--sell)}
.clnone{font-size:12.5px;color:var(--mut);padding:0 2px}
.vb{width:15px;height:15px;vertical-align:-3px;margin-left:5px}
/* table */
.tw{overflow:auto;max-height:560px;background:#fff;border-top:1px solid var(--line)}
table{width:100%;border-collapse:collapse;min-width:680px}
th{position:sticky;top:0;background:#fff;text-align:left;font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);padding:9px 12px;border-bottom:1px solid var(--line);z-index:1;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid #F1F2F4;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.num{font-weight:700}
tr:hover td{background:#FFFCF0}
.pill{display:inline-block;padding:2px 9px;border-radius:6px;font-size:11.5px;font-weight:800;letter-spacing:.4px}
.pill.buy{background:rgba(5,150,105,.1);color:var(--buyink);border:1px solid rgba(5,150,105,.4)}
.pill.sell{background:rgba(220,38,38,.09);color:var(--sellink);border:1px solid rgba(220,38,38,.4)}
.cc{display:flex;align-items:center;gap:7px;font-weight:600}
.sub{color:var(--mut);font-size:11.5px;display:block}
.flash td{animation:fl 6s ease-out}
@keyframes fl{0%{background:#F6E7A8}100%{background:transparent}}
.empty{padding:34px 18px;text-align:center;color:var(--mut);background:#fff}
.more{display:block;width:calc(100% - 36px);margin:10px 18px}

/* wallets */
details.wl{margin:0;border-top:1px solid var(--line);background:#fff}
details.wl summary{cursor:pointer;padding:10px 18px;font-weight:700;font-size:12.5px;color:var(--mut)}
.wr{display:flex;align-items:center;gap:10px;padding:6px 18px;border-top:1px solid #F1F2F4;font-size:12.5px;flex-wrap:wrap}
.wr .n{font-weight:600}
.wr .ad{color:var(--mut);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px}
.wr .st{margin-left:auto;font-size:11.5px;border-radius:20px;padding:1px 8px;border:1px solid var(--line)}
.st.ok{color:var(--buyink);border-color:rgba(16,185,129,.4)} .st.err{color:var(--sellink);border-color:rgba(239,68,68,.4)} .st.idle{color:var(--mut)}
.ib{border:0;background:none;cursor:pointer;color:var(--mut);padding:2px 6px;border-radius:6px}
.ib:hover{background:var(--goldsoft);color:var(--gold2)}

/* modal */
.ov{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.ov.show{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:470px;padding:22px;border-top:4px solid var(--gold);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h3{margin:0 0 14px;font-size:17px}
.modal label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:12px 0 5px}
.modal input,.modal select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff}
.modal input:focus,.modal select:focus{outline:2px solid var(--goldsoft);border-color:var(--gold)}
.modal .err{color:var(--sellink);font-size:12.5px;min-height:18px;margin-top:8px}
.modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:10px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#fff;color:var(--ink);border:1px solid var(--gold);box-shadow:0 8px 28px rgba(184,134,11,.25);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;font-size:13px}
.toast.show{opacity:1;transform:translateX(-50%)}
footer{padding:12px 22px 28px;color:var(--mut);font-size:11.5px;text-align:center}
</style>
</head>
<body>

<div id="ticker" class="ticker"></div>

<header class="top">
  <div class="brand">
    <svg viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F1D98A"/><stop offset=".5" stop-color="#D4AF37"/><stop offset="1" stop-color="#B8941F"/></linearGradient></defs><path d="M20 2 37 20 20 38 3 20Z" fill="url(#g)"/><path d="M20 9 31 20 20 31 9 20Z" fill="#fff" opacity=".92"/><path d="M20 14 26 20 20 26 14 20Z" fill="url(#g)"/></svg>

  <div class="sync"><span class="dot" id="syncDot"></span><span id="syncTxt"></span></div>
  <button class="btn" id="btnOlder" data-i18n="older"></button>
  <button class="btn gold" id="btnAdd" data-i18n="addWallet"></button>
  <div class="lang" id="lang">
    <button data-lang="uz">UZ</button><button data-lang="ru">RU</button><button data-lang="en">EN</button>
  </div>
</header>

<div class="aiwrap"><div class="ai" id="ai"></div></div>
<main class="grid" id="grid"></main>

<footer data-i18n="footer"></footer>

<div class="ov" id="ov">
  <form class="modal" id="form" autocomplete="off">
    <h3 id="mTitle" data-i18n="mTitle"></h3>
    <label data-i18n="fAddr"></label>
    <input id="fAddr" required spellcheck="false" placeholder="0x…  /  bc1…">
    <label data-i18n="fLabel"></label>
    <input id="fLabel" required maxlength="40">
    <label data-i18n="fType"></label>
    <select id="fType">
      <option value="inst" data-i18n="tInst"></option>
      <option value="smc" data-i18n="tSmc"></option>
      <option value="exch" data-i18n="tExch"></option>

    <div class="err" id="fErr"></div>
    <div class="row">
      <button type="button" class="btn" id="fCancel" data-i18n="cancel"></button>
      <button type="submit" class="btn gold" data-i18n="save"></button>
    </div>
  </form>
</div>
<div class="toast" id="toast"></div>

<script>

/* ================= helpers ================= */

  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},

const coinIcon=s=>{const k=COINS.find(c=>c.s===s);const g=k?k.g:s.slice(0,2);return `<span class="coin" style="background:${coinColor(s)}">${esc(g)}</span>`};

const PROXIES=[u=>`https://corsproxy.io/?${encodeURIComponent(u)}`,u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,u=>`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`];
const proxyMode={};
async function jraw(url,ms){
  const c=new AbortController(); const to=setTimeout(()=>c.abort(),ms);
  try{
    const r=await fetch(url,{signal:c.signal});
    if(!r.ok){const e=new Error('HTTP '+r.status);e.status=r.status;throw e}
    return await r.json();
  }finally{clearTimeout(to)}
}
/* direct first; on CORS/network/403/429/5xx retry via corsproxy.io (then allorigins, codetabs) — public data only; works from file:// and GitHub Pages */
async function jget(url,ms=15000){
  const host=new URL(url).host, viaFirst=proxyMode[host]&&Date.now()<proxyMode[host];
  const direct=()=>jraw(url,ms);
  const proxied=async()=>{let last;for(const p of PROXIES){try{return await jraw(p(url),ms+5000)}catch(e){last=e}}throw last};
  const retryable=e=>!e.status||e.status===403||e.status===429||e.status>=500;
  if(viaFirst){ try{return await proxied()}catch(e){ return await direct() } }
  try{ return await direct() }
  catch(e){
    if(!retryable(e)) throw e;
    try{ const r=await proxied(); if(!e.status) proxyMode[host]=Date.now()+600000; return r }
    catch(e2){ throw e.status?e:e2 }
  }
}

/* ================= parsers ================= */
const mkUrl=(chain,hash)=>chain==='BTC'?`https://mempool.space/tx/${hash}`:`https://etherscan.io/tx/${hash}`;
function mkRec(w,o){
  return {id:o.id,w:w.id,a:norm(w.addr),chain:w.chain,sym:o.sym,side:o.side,amt:o.amt,usd:o.usd,ts:o.ts,hash:o.hash,cp:o.cp||null,est:!!o.est};
}
function parseBtc(w,tx){
  const A=w.addr, conf=tx.status&&tx.status.confirmed;
  const ts=conf?tx.status.block_time:Math.floor(Date.now()/1000);
  const pr=priceAt('BTC',ts); if(!pr) return [];
  let sent=0,recv=0; const outs=new Map(), ins=new Map();
  for(const i of tx.vin||[]){const po=i.prevout;if(!po)continue;const a=po.scriptpubkey_address;
    if(a===A)sent+=po.value;else if(a)ins.set(a,(ins.get(a)||0)+po.value)}
  for(const o of tx.vout||[]){const a=o.scriptpubkey_address;
    if(a===A)recv+=o.value;else if(a)outs.set(a,(outs.get(a)||0)+o.value)}
  let dirOut,parts;
  if(sent>0){parts=outs;dirOut=true}else if(recv>0){parts=ins;dirOut=false}else return [];
  const had=parts.size;
  for(const a of sameGroup(w)) parts.delete(a);       // internal self-transfers
  if(dirOut&&parts.size===0) return [];                // all change / internal
  if(!dirOut&&had>0&&parts.size===0) return [];
  const rec=(cp,sats,key)=>{
    const btc=sats/1e8;
    return mkRec(w,{id:`${w.id}:${tx.txid}${key?':'+key:''}`,sym:'BTC',amt:btc,usd:btc*pr.p,ts,hash:tx.txid,cp,est:pr.est,
      side:w.type==='exch'?(dirOut?'buy':'sell'):(dirOut?'sell':'buy')});
  };
  if(w.type==='exch') return [...parts].map(([cp,sats])=>rec(cp,sats,cp));
  let total=0,top=null,topv=0;
  for(const [a,v] of parts){total+=v;if(v>topv){topv=v;top=a}}
  return [rec(top,dirOut?total:recv,'')];
}
function parseEthTx(w,t){
  if(t.status==='error'||(t.result&&/fail|error|revert/i.test(t.result))) return null;
  let wei; try{wei=BigInt(t.value||'0')}catch(e){return null}
  if(wei===0n) return null;
  const from=norm(t.from&&t.from.hash), to=norm(t.to&&t.to.hash), A=norm(w.addr);
  if(!from||!to||from===to) return null;
  const out=from===A, cp=out?to:from;
  if(sameGroup(w).includes(cp)) return null;
  const ts=Math.floor(Date.parse(t.timestamp)/1000); if(!ts) return null;
  const pr=priceAt('ETH',ts); if(!pr) return null;
  const eth=Number(wei)/1e18;
  return mkRec(w,{id:`${w.id}:${t.hash}`,sym:'ETH',amt:eth,usd:eth*pr.p,ts,hash:t.hash,cp,est:pr.est,
    side:w.type==='exch'?(out?'buy':'sell'):(out?'sell':'buy')});
}
function parseTok(w,t){
  const tok=t.token||{}; const sym=(tok.symbol||'').trim();
  if(!sym||(tok.type&&tok.type!=='ERC-20')||STABLES.has(sym.toUpperCase())) return null;
  const hash=t.transaction_hash||t.tx_hash; if(!hash) return null;
  const from=norm(t.from&&t.from.hash), to=norm(t.to&&t.to.hash), A=norm(w.addr);
  if(!from||!to||from===to) return null;
  const out=from===A, cp=out?to:from;
  if(sameGroup(w).includes(cp)) return null;
  const ts=Math.floor(Date.parse(t.timestamp)/1000); if(!ts) return null;
  const tot=t.total||{}; let raw; try{raw=BigInt(tot.value||'0')}catch(e){return null}
  const dec=parseInt(tot.decimals??tok.decimals??18,10);
  const amt=Number(raw)/Math.pow(10,dec); if(!(amt>0)) return null;
  let price=null,est=true;
  const wb=WRAPPED[sym.toUpperCase()];
  if(wb){const pr=priceAt(wb,ts);if(pr){price=pr.p;est=pr.est}}
  else if(tok.exchange_rate!=null&&+tok.exchange_rate>0) price=+tok.exchange_rate;
  if(!price) return null;
  return mkRec(w,{id:`${w.id}:${hash}:${t.log_index??sym}`,sym:sym.slice(0,8).toUpperCase(),amt,usd:amt*price,ts,hash,cp,est,
    side:w.type==='exch'?(out?'buy':'sell'):(out?'sell':'buy')});
}

/* ================= fetching ================= */
async function fetchBtc(w,mode){
  const m=meta(w.id), base=`https://mempool.space/api/address/${w.addr}`;
  const out=[]; let last=null, pages;
  if(mode==='older'){ if(!m.btcCursor||m.btcEnd) return out; last=m.btcCursor; pages=CFG.OLDER_PAGES; }
  else pages=mode==='init'?CFG.BACKFILL_PAGES:1;
  for(let p=0;p<pages;p++){
    const arr=await jget(last?`${base}/txs/chain/${last}`:`${base}/txs`);
    if(!Array.isArray(arr)||!arr.length){ if(mode!=='live') m.btcEnd=true; break; }
    out.push(...arr);
    const conf=arr.filter(x=>x.status&&x.status.confirmed);
    if(!conf.length){ if(mode!=='live') m.btcEnd=true; break; }
    last=conf[conf.length-1].txid;
    if(mode!=='live') m.btcCursor=last;
    if(conf.length<25){ if(mode!=='live') m.btcEnd=true; break; }
    if(p<pages-1) await sleep(700);
  }
  return out;
}
async function fetchEth(w,mode){
  const m=meta(w.id); m.next=m.next||{}; m.end=m.end||{};
  const base=`https://eth.blockscout.com/api/v2/addresses/${w.addr}`;
  const res={transactions:[],'token-transfers':[]}; let fails=0;
  for(const kind of ['transactions','token-transfers']){
    try{
      let np=null,pages;
      if(mode==='older'){ if(m.end[kind]||!m.next[kind]) continue; np=m.next[kind]; pages=CFG.OLDER_PAGES; }
      else pages=mode==='init'?CFG.BACKFILL_PAGES:1;
      for(let p=0;p<pages;p++){
        const q=new URLSearchParams();
        if(kind==='token-transfers') q.set('type','ERC-20');
        if(np) for(const [k,v] of Object.entries(np)) if(v!=null) q.set(k,v);
        const qs=q.toString();
        const d=await jget(`${base}/${kind}${qs?'?'+qs:''}`);
        res[kind].push(...(d.items||[]));
        np=d.next_page_params||null;
        if(mode!=='live'){ m.next[kind]=np; if(!np) m.end[kind]=true; }
        if(!np) break;
        await sleep(800);
      }
    }catch(e){ fails++; if(kind==='transactions'&&fails&&mode!=='older') {/* try tokens anyway */} res.err=e; }
    await sleep(500);
  }
  if(fails===2) throw res.err||new Error('fetch failed');
  return res;
}

async function syncWallet(w,mode){

  await Promise.all([loadHist('BTC'),loadHist('ETH')]);
  let recs=[];
  if(w.chain==='BTC'){ (await fetchBtc(w,mode)).forEach(tx=>recs.push(...parseBtc(w,tx))); }
  else{
    const o=await fetchEth(w,mode);
    o.transactions.forEach(x=>recs.push(parseEthTx(w,x)));
    o['token-transfers'].forEach(x=>recs.push(parseTok(w,x)));
  }
  const add=[]; let created=0;
  for(const r of recs){
    if(!r||!passIngest(w,r)) continue;
    const had=S.txs.has(r.id); S.txs.set(r.id,r); add.push(r);
    if(!had){created++; if(m.initDone&&mode==='live') S.fresh.set(r.id,Date.now());}
  }
  await DB.put(add);
  if(mode==='init') m.initDone=true;
  return created;
}
const active=()=>S.wallets.filter(w=>w.addr&&w.chain);
const historyDone=(m,w)=>w.chain==='BTC'?!!m.btcEnd:!!(m.end&&m.end.transactions&&m.end['token-transfers']);

async function syncCycle(){
  if(S.busy) return; S.busy=true; paintStatus();
  try{
    if(!S.prices.BTC||!S.prices.ETH) await loadPrices();
    const ws=active();
    for(let i=0;i<ws.length;i++){
      const w=ws[i], m=meta(w.id);
      if(m.skip>0){m.skip--;continue}
      try{
        const mode=m.initDone?'live':'init';
        await syncWallet(w,mode); m.err=0;m.error=null;m.lastOk=Date.now();S.lastLive=Date.now();
        /* automatic history: no button click needed (2 rounds on first load, then 1 per cycle) */
        const rounds=mode==='init'?2:1;
        for(let r=0;r<rounds&&(m.auto||0)<CFG.AUTO_ROUNDS&&!historyDone(m,w);r++){
          await sleep(800);
          try{ await syncWallet(w,'older'); }catch(e){ break }
          m.auto=(m.auto||0)+1; render();
        }
        if(historyDone(m,w)) m.auto=CFG.AUTO_ROUNDS;
      }
      catch(e){ m.err=(m.err||0)+1; m.error=e.message||String(e); m.skip=Math.min(2**m.err-1,8); }
      saveMeta(); render();
      if(i<ws.length-1) await sleep(CFG.STAGGER_MS+Math.random()*600);   // staggered polling
    }
  }catch(e){}
  S.busy=false; S.lastCycle=Date.now(); S.firstDone=true; saveMeta(); render(); paintStatus();
}
async function loadOlder(){
  if(S.busy){return}
  S.busy=true; paintStatus(); $('#btnOlder').disabled=true; let total=0;
  try{
    await loadPrices().catch(()=>{});
    for(const w of active()){
      const m=meta(w.id); if(!m.initDone) continue;
      try{ total+=await syncWallet(w,'older'); }catch(e){}
      saveMeta(); render(); await sleep(CFG.STAGGER_MS);
    }
  }catch(e){}
  S.busy=false; $('#btnOlder').disabled=false; paintStatus(); render();
  toast(total?`${t('olderDone')}: +${total}`:t('olderNone'));
}

/* ================= AI trend analysis (both panels combined) ================= */
const SMCK='\u0000smc', CLUSTER_H=24, CLUSTER_MIN=3;
function analyze(list){
  const now=new Date(), days=[];
  for(let i=0;i<7;i++){const d=new Date(now);d.setDate(d.getDate()-i);days.push(dayKeyLocal(d))}
  const coins=new Map();
  for(const x of list){
    if(STABLES.has(x.sym)) continue;
    const di=days.indexOf(dayKeyLocal(new Date(x.ts*1000))); if(di<0) continue;
    let c=coins.get(x.sym);
    if(!c){c={net:Array(7).fill(0),buy:Array(7).fill(0),sell:Array(7).fill(0),by:Array.from({length:7},()=>new Map())};coins.set(x.sym,c)}
    const v=x.side==='buy'?x.usd:-x.usd;
    c.net[di]+=v; if(v>0)c.buy[di]+=x.usd; else c.sell[di]+=x.usd;
    const who=x.pk==='smc'?SMCK:baseName(x.who);
    c.by[di].set(who,(c.by[di].get(who)||0)+v);
  }
  const signals=[],chips=[];
  for(const [sym,c] of coins){
    chips.push({sym,net:c.net.reduce((a,b)=>a+b,0)});
    const start=c.net[0]!==0?0:1, sign=Math.sign(c.net[start]||0); if(!sign) continue;
    let n=0,total=0,end=start,bb=0,ss=0;
    for(let i=start;i<7;i++){ if(Math.sign(c.net[i])===sign){n++;total+=Math.abs(c.net[i]);bb+=c.buy[i];ss+=c.sell[i];end=i} else break; }
    if(n<3) continue;
    const comp=new Map();
    for(let i=start;i<=end;i++) for(const [k,v] of c.by[i]) comp.set(k,(comp.get(k)||0)+v);
    const win=[...comp].filter(([,v])=>Math.sign(v)===sign).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).map(([k])=>k);
    const p=Math.max(65,Math.min(85,Math.round(65+Math.min(10,(n-3)*2.5)+Math.min(10,Math.log10(Math.max(total,1e6)/1e6)*4))));
    signals.push({sym,dir:sign>0?'bull':'bear',n,total,p,s:Math.round(ss/Math.max(bb+ss,1)*100),
      names:win.filter(k=>k!==SMCK),smc:win.includes(SMCK)});
  }
  signals.sort((a,b)=>b.total-a.total); chips.sort((a,b)=>Math.abs(b.net)-Math.abs(a.net));
  return {signals:signals.slice(0,3),chips:chips.slice(0,5)};
}
function actorsText(sg){
  const parts=[...new Set(sg.names.map(baseName))].slice(0,2);
  if(sg.smc) parts.push(t('actSmc'));
  if(!parts.length) return t('fallbackActors');
  return parts.length===1?parts[0]:parts.slice(0,-1).join(', ')+` ${t('and')} `+parts[parts.length-1];
}
function clusters(list){
  const cut=Date.now()/1000-CLUSTER_H*3600, g=new Map();
  for(const x of list){
    if(x.ts<cut||STABLES.has(x.sym)) continue;
    const key=x.sym+'|'+x.side; let e=g.get(key); if(!e){e={sym:x.sym,side:x.side,w:new Set(),usd:0};g.set(key,e)}
    e.w.add(x.who); e.usd+=x.usd;
  }
  return [...g.values()].filter(e=>e.w.size>=CLUSTER_MIN).sort((a,b)=>b.usd-a.usd);
}
const whoOf=x=>{const w=S.wallets.find(q=>q.id===x.w);if(!w)return '';
  return w.type==='exch'?shortAddr(x.cp):w.label};
function visible(panel){
  const P=PANELS[panel], v=S.view[panel], cut=v.period==='24h'?864e2:v.period==='7d'?6048e2:v.period==='30d'?2592e3:0;
  const nowS=Date.now()/1000, byId=new Map(S.wallets.map(w=>[w.id,w]));
  const out=[];
  for(const x of S.txs.values()){
    const w=byId.get(x.w); if(!w||!w.addr||norm(w.addr)!==x.a||!P.types.includes(w.type)) continue;
    if(panel==='inst'){ if(x.usd<CFG.MIN_INST) continue; }
    else if(x.usd<CFG.SMC_MIN||x.usd>CFG.SMC_MAX) continue;
    x.who=whoOf(x); x.via=w.type==='exch'?w.label:''; x.pk=panel; x.co=baseName(w.label); x.verified=!!(w.builtin&&!w.slot);
    out.push(x);

  return {all:out,period:cut?out.filter(x=>nowS-x.ts<=cut):out};
}

});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, k=b.dataset.k, id=b.dataset.id;
  if(act==='speak') speak(k);
  else if(act==='more'){S.view[k].limit+=100;render()}
  else if(act==='pill'){const v=S.view.inst;v[b.dataset.kind==='co'?'co':'coin']=b.dataset.v;v.limit=100;render()}
  else if(act==='setaddr') openModal(S.wallets.find(w=>w.id===id));
  else if(act==='rm'){
    const w=S.wallets.find(x=>x.id===id); if(!w) return;
    if(w.slot){w.addr='';w.chain=null} else S.wallets=S.wallets.filter(x=>x.id!==id);
    delete S.meta[id]; saveWallets(); saveMeta(); render();
  }
});

/* ================= toast ================= */
let tt=0;
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),3800)}

/* ================= boot ================= */
(async function init(){
  buildShell(); applyI18n(); renderTicker(); doRender();
  if('speechSynthesis' in window) try{speechSynthesis.getVoices()}catch(e){}
  await DB.open();
  const saved=await DB.all(); saved.forEach(x=>S.txs.set(x.id,x));
  S.loaded=true; doRender();
  loadPrices().catch(()=>{}); setInterval(()=>loadPrices().catch(()=>{}),20000);
  syncCycle(); setInterval(syncCycle,CFG.POLL_MS);
  setInterval(paintStatus,1000);
})();

})();
</script>
